version: '3.8'

services:
  road-safety-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: road-safety-system:latest
    container_name: road_safety_cv_app
    ports:
      - "8501:8501"
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
    environment:
      - LOG_LEVEL=INFO
      - APP_ENV=local
    restart: unless-stopped
